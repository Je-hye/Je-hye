<svg width="900" height="250" viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0.35"/>
      <stop offset="50%"  stop-color="#7ee8fa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#7ee8fa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .name { animation: fadeUp 1s ease-out 0.1s both; }
      .sub  { animation: fadeUp 1s ease-out 0.5s both; }
      .w1   { animation: waveMove 6s ease-in-out infinite; }
      .w2   { animation: waveMove 8s ease-in-out 1s infinite reverse; }
      @keyframes fadeUp {
        from { opacity:0; transform:translateY(10px); }
        to   { opacity:1; transform:translateY(0); }
      }
      @keyframes waveMove {
        0%,100% { d: path("M0,210 C150,185 300,230 450,210 C600,190 750,235 900,210 L900,250 L0,250 Z"); }
        50%      { d: path("M0,220 C150,240 300,195 450,220 C600,245 750,200 900,220 L900,250 L0,250 Z"); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="250" fill="url(#bg)"/>

  <!-- Star dots -->
  <circle cx="60"  cy="35"  r="1.5" fill="#58A6FF" opacity="0.5"/>
  <circle cx="180" cy="20"  r="1"   fill="#7ee8fa" opacity="0.4"/>
  <circle cx="320" cy="45"  r="1.5" fill="#58A6FF" opacity="0.3"/>
  <circle cx="580" cy="25"  r="1"   fill="#7ee8fa" opacity="0.5"/>
  <circle cx="720" cy="50"  r="1.5" fill="#58A6FF" opacity="0.4"/>
  <circle cx="850" cy="30"  r="1"   fill="#7ee8fa" opacity="0.3"/>
  <circle cx="100" cy="155" r="1"   fill="#58A6FF" opacity="0.25"/>
  <circle cx="800" cy="140" r="1.5" fill="#7ee8fa" opacity="0.25"/>

  <!-- Wave layers -->
  <path class="w2" d="M0,215 C150,195 300,235 450,215 C600,195 750,240 900,215 L900,250 L0,250 Z"
    fill="#58A6FF" opacity="0.12"/>
  <path class="w1" d="M0,210 C150,185 300,230 450,210 C600,190 750,235 900,210 L900,250 L0,250 Z"
    fill="url(#wave1)"/>

  <!-- Top accent -->
  <rect x="0" y="0" width="900" height="2.5" fill="#58A6FF" opacity="0.5"/>

  <!-- Name -->
  <text x="450" y="108"
    text-anchor="middle"
    font-family="'Segoe UI','SF Pro Display',Arial,sans-serif"
    font-size="56" font-weight="700"
    fill="url(#nameGrad)"
    filter="url(#glow)"
    class="name">EunHye Jeong</text>

  <!-- Divider -->
  <rect x="360" y="122" width="180" height="1.5" fill="#58A6FF" opacity="0.4" rx="1"/>

  <!-- Subtitle -->
  <text x="450" y="155"
    text-anchor="middle"
    font-family="'Segoe UI',Arial,sans-serif"
    font-size="16" letter-spacing="3"
    fill="#8B9EC9"
    class="sub">AI SYSTEMS  ·  BACKEND  ·  MULTI-AGENT</text>
</svg>
