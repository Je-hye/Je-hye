<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#7ee8fa"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0.35"/>
      <stop offset="50%"  stop-color="#7ee8fa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .w1 { animation: waveMove 6s ease-in-out infinite; }
      .w2 { animation: waveMove 8s ease-in-out 1s infinite reverse; }
      @keyframes waveMove {
        0%,100% { d: path("M0,150 C150,130 300,165 450,150 C600,135 750,168 900,150 L900,200 L0,200 Z"); }
        50%      { d: path("M0,160 C150,178 300,140 450,160 C600,178 750,140 900,160 L900,200 L0,200 Z"); }
      }
    </style>
  </defs>

  <rect width="900" height="200" fill="url(#bg)"/>

  <circle cx="60"  cy="28" r="1.5" fill="#58A6FF" opacity="0.5"/>
  <circle cx="160" cy="14" r="1"   fill="#7ee8fa" opacity="0.4"/>
  <circle cx="290" cy="38" r="1.5" fill="#58A6FF" opacity="0.3"/>
  <circle cx="550" cy="18" r="1"   fill="#7ee8fa" opacity="0.4"/>
  <circle cx="700" cy="44" r="1.5" fill="#58A6FF" opacity="0.3"/>
  <circle cx="840" cy="22" r="1"   fill="#7ee8fa" opacity="0.3"/>

  <rect x="0" y="0" width="900" height="2.5" fill="#58A6FF" opacity="0.5"/>

  <!-- 텍스트 왼쪽 정렬 -->
  <text x="80" y="88"
    font-family="'Segoe UI','SF Pro Display',Arial,sans-serif"
    font-size="54" font-weight="700"
    fill="url(#nameGrad)" filter="url(#glow)">EunHye Jeong</text>

  <rect x="80" y="103" width="180" height="1.5" fill="#58A6FF" opacity="0.35" rx="1"/>

  <text x="80" y="132"
    font-family="'Segoe UI',Arial,sans-serif"
    font-size="14" letter-spacing="3"
    fill="#8B9EC9">AI SYSTEMS  ·  BACKEND  ·  MULTI-AGENT</text>

  <path class="w2"
    d="M0,155 C150,135 300,170 450,155 C600,140 750,173 900,155 L900,200 L0,200 Z"
    fill="#58A6FF" opacity="0.1"/>
  <path class="w1"
    d="M0,150 C150,130 300,165 450,150 C600,135 750,168 900,150 L900,200 L0,200 Z"
    fill="url(#waveGrad)"/>
</svg>