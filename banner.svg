<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#7ee8fa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .name  { animation: fadeUp 1.2s ease-out 0.2s both; }
      .sub   { animation: fadeUp 1.2s ease-out 0.7s both; }
      .bar   { animation: grow  1.4s ease-out 0.4s both; }
      .dot1  { animation: pulse 3s ease-in-out 0s infinite; }
      .dot2  { animation: pulse 3s ease-in-out 0.8s infinite; }
      .dot3  { animation: pulse 3s ease-in-out 1.6s infinite; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes grow {
        from { transform: scaleX(0); }
        to   { transform: scaleX(1); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.15; r: 3; }
        50%       { opacity: 0.6;  r: 5; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bg)" rx="0"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="900" height="3" fill="#58A6FF" opacity="0.7" class="bar" style="transform-origin: left center;"/>

  <!-- Floating dots -->
  <circle class="dot1" cx="80"  cy="55"  r="3" fill="#58A6FF"/>
  <circle class="dot2" cx="820" cy="80"  r="3" fill="#7ee8fa"/>
  <circle class="dot3" cx="150" cy="165" r="3" fill="#58A6FF"/>
  <circle class="dot1" cx="750" cy="155" r="2" fill="#7ee8fa"/>
  <circle class="dot2" cx="450" cy="30"  r="2" fill="#58A6FF"/>

  <!-- Left accent line -->
  <rect x="60" y="72" width="3" height="76" fill="#58A6FF" opacity="0.5" rx="2"/>

  <!-- Name -->
  <text x="450" y="110"
    text-anchor="middle"
    font-family="'Segoe UI', 'SF Pro Display', Arial, sans-serif"
    font-size="54" font-weight="700"
    fill="url(#nameGrad)"
    filter="url(#glow)"
    class="name">
    EunHye Jeong
  </text>

  <!-- Divider -->
  <rect x="340" y="124" width="220" height="1" fill="#58A6FF" opacity="0.35" rx="1"/>

  <!-- Subtitle -->
  <text x="450" y="155"
    text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="17" letter-spacing="2.5"
    fill="#8B9EC9"
    class="sub">
    AI SYSTEMS  ·  BACKEND  ·  MULTI-AGENT
  </text>

  <!-- Bottom accent bar -->
  <rect x="0" y="217" width="900" height="3" fill="#0f3460" opacity="0.8"/>
</svg>
